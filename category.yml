categorical: # Categorical features are those that represent discrete categories or groups. 
  tool_material: # This is category description corresponding to the column name in the dataset.
    - grass # First categorical value for the tool material feature.
    - stone 
    - wood fresh 
    - wood old 
    - bamboo 
    - unsure
  species:
    - human # First categorical value for the species feature.
  age_group:
    - young # First categorical value for the age group feature.
    - adult 
binary: # Binary features are those that have only two possible values, which can be answered with yes/no.
  - young involved # This again corresponds to the column name in the dataset, and the values would be yes or no based on whether a young individual was involved in the gesture.
  - adult involved 
  - tool reuse observed
numerical: # Numerical features are those that represent measurable quantities and can take on a wide range of values.
  - temperature
  - time of gesture
text: # Text features are those that consist of unstructured text data, such as descriptions or comments.
  - gesture description